[workspace]
resolver = "2"
members = ["core", "sim", "contract", "e2e"]
default-members = ["core", "sim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false
