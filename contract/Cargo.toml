[package]
name = "contagion-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/space-rock/contagion"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
image_digest = "sha256:8013f039e8005627f10ae66b5519d1a6eeeed7d7aef4b5067d5e9a86c4302fcc"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--profile", "wasm"]

[dependencies]
contagion-core = { path = "../core" }
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
contagion-core = { path = "../core", features = ["abi"] }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
base64 = "0.22"
